[tool.poetry]
name = "course-project-drf"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.5"
djangorestframework = "^3.16.1"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
pillow = "^11.3.0"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.4"
drf-yasg = "^1.21.10"
django-filter = "^25.1"
celery = "^5.5.3"
eventlet = "^0.40.2"
redis = "^6.4.0"
django-celery-beat = "^2.8.1"
requests = "^2.32.4"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.17.1"
black = "^25.1.0"
isort = "^6.0.1"


[tool.black]
line-length = 119
exclude = ".git/"


[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
